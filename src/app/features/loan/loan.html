<div class="app-page">
  <app-page-header
    title="Loan"
    subtitle="Declare your EMIs and calculate new loan instalments"
    icon="account_balance"
  />

  <mat-tab-group
    animationDuration="200ms"
    [selectedIndex]="selectedTab()"
    (selectedIndexChange)="onTabChange($event)"
  >
    <!-- My loans -->
    <mat-tab label="My loans">
      <div class="flex flex-col gap-5 pt-5">
        <div class="grid grid-cols-[repeat(auto-fit,minmax(180px,1fr))] gap-4">
          <app-stat-tile
            label="Total EMIs"
            [value]="derived().totalLoanEmis | inr"
            hint="per month"
            icon="account_balance"
            data-testid="loan-total-tile"
          />
        </div>

        <app-section-card
          title="EMIs"
          eyebrow="Owned here · monthly · → Needs"
          icon="request_quote"
          subtitle="Loan repayments — home, car, personal. A name and an instalment is all the budget needs; add the balance and rate to forecast when you're debt free."
        >
          <app-loan-list />
        </app-section-card>
      </div>
    </mat-tab>

    <!-- EMI calculator -->
    <mat-tab label="EMI calculator">
      <app-emi-calculator />
    </mat-tab>
  </mat-tab-group>
</div>
