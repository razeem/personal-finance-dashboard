<div class="app-page">
  <app-page-header
    title="Investing"
    subtitle="Declare your monthly long-term contributions — and see what they'll really be worth"
    icon="trending_up"
  />

  <mat-tab-group
    animationDuration="200ms"
    [selectedIndex]="selectedTab()"
    (selectedIndexChange)="onTabChange($event)"
  >
    <!-- Contributions (the values this pillar owns) -->
    <mat-tab label="Contributions">
      <div class="flex flex-col gap-5 pt-5">
        <div class="grid grid-cols-[repeat(auto-fit,minmax(180px,1fr))] gap-4">
          <app-stat-tile
            label="Total investments"
            [value]="derived().totalInvestments | inr"
            hint="per month"
            icon="trending_up"
            data-testid="investing-total-tile"
          />
        </div>

        <app-section-card
          title="Mandatory"
          eyebrow="Owned here · → Living"
          icon="lock"
          subtitle="Statutory retirement contributions (EPF, NPS). Counted under Living. EPF defaults to ₹1,850. Yearly amounts are counted as their monthly twelfth."
        >
          <app-line-item-list
            [ops]="mandatory"
            typeLabel="Instrument"
            valueLabel="Amount"
            addLabel="Add mandatory"
            emptyText="No mandatory contributions."
            testid="invest-mandatory"
            [allowPeriod]="true"
          />
        </app-section-card>

        <app-section-card
          title="Voluntary"
          eyebrow="Owned here · → Growth & Freedom"
          icon="rocket_launch"
          subtitle="Extra investments you choose — mutual funds, stocks, PPF. Counted under Growth & Freedom. Yearly amounts are counted as their monthly twelfth."
        >
          <app-line-item-list
            [ops]="voluntary"
            typeLabel="Instrument"
            valueLabel="Amount"
            addLabel="Add voluntary"
            emptyText="No voluntary investments yet."
            testid="invest-voluntary"
            [allowPeriod]="true"
          />
        </app-section-card>
      </div>
    </mat-tab>

    <!-- Inflation adjuster -->
    <mat-tab label="Inflation adjuster">
      <app-inflation-adjuster />
    </mat-tab>

    <!-- NPS calculator -->
    <mat-tab label="NPS calculator">
      <app-nps-calculator />
    </mat-tab>
  </mat-tab-group>
</div>
